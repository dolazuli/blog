title: articles
# email: your-email@example.com
# description: >- # this means to ignore newlines until "baseurl:"
#   Write an awesome description for your new site here. You can edit this
#   line in _config.yml. It will appear in your document head meta (for
#   Google search results) and in your feed.xml site description.
baseurl: "/blog" # the subpath of your site, e.g. /blog
url: "https://chasereynolds.me" # the base hostname & protocol for your site, e.g. http://example.com
# twitter_username: jekyllrb
# github_username:  jekyll

remote_theme: abhinavs/moonwalk
plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-soopr-seo-tag
  - jekyll-markdown-output
  - jekyll-llms-output

theme_config:
  appearance: "dark"
  appearance_toggle: true
  date_format: "%Y-%m-%d"

  show_description: true
  show_navbar: true
  show_footer: false

  show_projects: false
  show_blog: true
  show_old_projects: false
  show_misc_list: false

  show_reading_time: true
  show_tags: true

  # home:
  #   title_blog: Blog
